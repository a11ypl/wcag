<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plac zabaw HTML | Accessibility First</title>
<style>
:root {
  --fiolet: #5F338A; --zolty: #FEDB16; --tlo: #E2F4FF; --tekst: #14191d;
  --fokus-wewn: #FEDB16; --fokus-zewn: #000;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: system-ui, sans-serif; color: var(--tekst); background: var(--fiolet);
  display: flex; flex-direction: column; font-size: 1.05rem; }
.skiplink { position: absolute; left: 0; top: 0; z-index: 10; transform: translateY(-120%);
  background: #000; color: #fff; padding: .6rem 1rem; font-weight: 700; }
.skiplink:focus { transform: none; }
:focus-visible { outline: 3px solid var(--fokus-wewn); outline-offset: 2px; box-shadow: 0 0 0 7px var(--fokus-zewn); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; padding: .6rem 1rem; color: #fff; }
header h1 { margin: 0 auto 0 0; font-size: 1.35rem; font-weight: 800; }
header h1 span { color: var(--zolty); }
.przyciski { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
button, select { font: inherit; min-height: 44px; padding: .4rem .9rem; border-radius: .35rem;
  border: 2px solid #fff; background: transparent; color: #fff; font-weight: 600; cursor: pointer; }
select option { color: var(--tekst); }
button.glowny { background: var(--zolty); color: var(--tekst); border-color: var(--zolty); }
button:hover, select:hover { text-decoration: underline; }
label.przelacznik { display: inline-flex; gap: .4rem; align-items: center; font-weight: 600; min-height: 44px; }
label.przelacznik input { width: 1.2rem; height: 1.2rem; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: .6rem; padding: 0 .6rem .6rem; }
.edytory { display: grid; grid-template-rows: 3fr 2fr; gap: .6rem; min-height: 0; }
.panel { display: flex; flex-direction: column; min-height: 0; background: #fff; border-radius: .4rem; overflow: hidden; }
.panel h2 { margin: 0; padding: .35rem .8rem; font-size: 1rem; background: var(--tlo); color: var(--fiolet);
  display: flex; justify-content: space-between; align-items: center; }
.panel h2 small { font-weight: 400; color: #333; }
textarea { flex: 1; min-height: 8rem; width: 100%; border: 0; resize: none; padding: .7rem .8rem;
  font: 1rem/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #1b1b1b; background: #fff; tab-size: 2; }
iframe { flex: 1; width: 100%; border: 0; background: #fff; }
#status { color: #fff; font-size: .95rem; margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
.prawa { display: grid; grid-template-rows: 3fr 2fr; gap: .6rem; min-height: 0; }
.analiza-pasek { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; padding: .5rem .8rem; border-bottom: 1px solid #ddd; }
.analiza-info { font-size: .9rem; color: #333; }
button.maly { min-height: 40px; color: var(--fiolet); border-color: var(--fiolet); }
.wyniki { list-style: none; margin: 0; padding: .3rem .8rem .8rem; overflow: auto; flex: 1; }
.wyniki li { display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .7rem; align-items: start;
  padding: .55rem 0; border-bottom: 1px solid #eee; }
.wyniki .poziom { font-size: .8rem; font-weight: 800; text-transform: uppercase; padding: .15rem .45rem; border-radius: .25rem; border: 2px solid; white-space: nowrap; }
.poziom.blad { color: #8a0014; border-color: #8a0014; background: #fdecee; }
.poziom.ostrzezenie { color: #6b4400; border-color: #6b4400; background: #fff4d6; }
.poziom.wskazowka { color: #0b3d6e; border-color: #0b3d6e; background: #e6f0fa; }
.poziom.dobrze { color: #1b5e1b; border-color: #1b5e1b; background: #eaf7ea; }
.wyniki .opis strong { display: block; }
.wyniki .opis code { background: #f2f2f2; padding: 0 .25em; border-radius: .2em; font-size: .9em; word-break: break-all; }
.wyniki .wcag { font-size: .85rem; color: #333; }
.wyniki button { min-height: 36px; padding: .2rem .6rem; font-size: .9rem; color: var(--fiolet); border-color: var(--fiolet); }
@media (max-width: 50em) {
  main { grid-template-columns: 1fr; }
  .edytory, .prawa { grid-template-rows: auto auto; }
  .wyniki { max-height: 60vh; }
  iframe { min-height: 70vh; }
}
</style>
</head>
<body>
<a class="skiplink" href="#podglad-naglowek">Przejdź do podglądu</a>
<header>
  <h1>Plac zabaw <span>HTML</span></h1>
  <div class="przyciski">
    <label for="przyklad" class="sr-only">Wybierz przykład</label>
    <select id="przyklad">
      <option value="zespol">Przykład: strona z zespołem</option>
      <option value="bledy">Przykład: strona z błędami (do poprawy)</option>
      <option value="pusta">Przykład: pusta strona</option>
    </select>
    <button type="button" id="komentarz">Dodaj komentarz (Ctrl+/)</button>
    <button type="button" class="glowny" id="uruchom">Pokaż wynik (Ctrl+Enter)</button>
    <label class="przelacznik"><input type="checkbox" id="na-zywo" checked> Na żywo</label>
    <button type="button" id="nowa-karta">Otwórz w nowej karcie</button>
    <button type="button" id="pobierz">Pobierz .html</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</header>
<main>
  <div class="edytory">
    <section class="panel" aria-labelledby="h-html">
      <h2 id="h-html"><label for="kod-html">HTML</label> <small>wnętrze &lt;body&gt;</small></h2>
      <!-- Tab przenosi fokus dalej (bez pułapki klawiatury). Wcięcia: spacje. -->
      <textarea id="kod-html" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </section>
    <section class="panel" aria-labelledby="h-css">
      <h2 id="h-css"><label for="kod-css">CSS</label> <small>wnętrze &lt;style&gt;</small></h2>
      <textarea id="kod-css" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </section>
  </div>
  <div class="prawa">
    <section class="panel" aria-labelledby="podglad-naglowek">
      <h2 id="podglad-naglowek" tabindex="-1">Podgląd <small>tak to widzi przeglądarka</small></h2>
      <iframe id="podglad" title="Podgląd strony z edytora"></iframe>
    </section>
    <section class="panel" aria-labelledby="h-analiza">
      <h2 id="h-analiza">Analiza dostępności <small id="licznik-analizy">na żywo</small></h2>
      <div class="analiza-pasek">
        <button type="button" id="axe" class="maly">Pełny test axe-core</button>
        <span class="analiza-info">Reguły Accessibility First działają od razu. axe-core wymaga internetu.</span>
      </div>
      <ul id="wyniki" class="wyniki"></ul>
    </section>
  </div>
</main>

nQtc2l6ZT0iMzQiIGZvbnQtd2VpZ2h0PSI3MDAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiM4YTRiMDAiPkRaPC90ZXh0Pjwvc3ZnPgo=\" width=\"200\" height=\"200\" alt=\"\">\n      <h3>Darek Zieliński<\/h3>\n      <p class=\"rola\">Tester z niepełnosprawnością wzroku<\/p>\n      <p>Sprawdza, czy rozwiązania działają w prawdziwym życiu.<\/p>\n    <\/article>\n  <\/li>\n<\/ul>\n<\/section>\n\n<section aria-labelledby=\"liczby\">\n<h2 id=\"liczby\">Zespół w liczbach<\/h2>\n<!-- tabindex=\"0\": tabelę da się przewinąć strzałkami na wąskim ekranie.\n     <section> z nazwą = region: czytnik wie, czym jest ten fokusowalny obszar. -->\n<section class=\"tabela-przewijana\" aria-labelledby=\"tabela-podpis\" tabindex=\"0\">\n  <table>\n    <caption id=\"tabela-podpis\">Zespół i realizacje w latach 2024-2026<\/caption>\n    <thead>\n      <tr>\n        <th scope=\"col\">Rok<\/th>\n        <th scope=\"col\">Osoby w zespole<\/th>\n        <th scope=\"col\">Audyty<\/th>\n        <th scope=\"col\">Szkolenia<\/th>\n      <\/tr>\n    <\/thead>\n    <tbody>\n      <tr><th scope=\"row\">2024<\/th><td>2<\/td><td>15<\/td><td>20<\/td><\/tr>\n      <tr><th scope=\"row\">2025<\/th><td>3<\/td><td>30<\/td><td>45<\/td><\/tr>\n      <tr><th scope=\"row\">2026<\/th><td>4<\/td><td>50<\/td><td>80<\/td><\/tr>\n    <\/tbody>\n  <\/table>\n<\/section>\n<\/section>\n\n<section aria-labelledby=\"kontakt\">\n<h2 id=\"kontakt\">Kontakt<\/h2>\n<!-- Zwykły mailto: tekst linku = adres, wiadomo, co się stanie po kliknięciu. -->\n<p>Napisz do nas: <a href=\"mailto:a11y@wlaczwizje.pl\">a11y@wlaczwizje.pl<\/a><\/p>\n<\/section>\n\n<\/main>\n\n<footer>\n<nav aria-label=\"Menu w stopce\">\n  <ul>\n    <li><a href=\"#zespol\">Nasz zespół<\/a><\/li>\n    <li><a href=\"#kontakt\">Kontakt<\/a><\/li>\n    <li><a href=\"#main\">Wróć na górę strony<\/a><\/li>\n  <\/ul>\n<\/nav>\n<p><small>&copy; Maruderzy Dostępności 2026<\/small><\/p>\n<\/footer>", "css": "/* ===== KOLORY: zmieniasz w jednym miejscu ===== */\n:root {\n  --fokus-wewn: #ffdd00;   /* pierścień wewnętrzny: żółty, widoczny na ciemnym tle */\n  --fokus-zewn: #000;      /* pierścień zewnętrzny: czarny, widoczny na jasnym tle */\n  --granat: #0b3d6e;       /* biały tekst na granacie: ok. 11:1 */\n  --tekst: #1a1a1a;\n  --tlo-karty: #f7f9fc;\n}\n\n/* ===== PODSTAWY STRONY ===== */\nbody {\n  font-family: system-ui, sans-serif;\n  line-height: 1.5;        /* odstęp między wierszami (WCAG 1.4.12) */\n  color: var(--tekst);\n  max-width: 60rem;        /* wiersz nie za długi, łatwiej czytać */\n  margin: 0 auto;\n  padding: 0 1rem;\n}\n\n/* ===== OBRAZKI RESPONSYWNE ===== */\nimg {\n  max-width: 100%;         /* nigdy szersze niż kontener */\n  height: auto;            /* proporcje zachowane */\n  display: block;          /* bez szczeliny pod obrazkiem */\n}\n\n/* ===== UKRYTE WIZUALNIE, DOSTĘPNE DLA CZYTNIKA ===== */\n.sr-only {\n  position: absolute;\n  width: 1px; height: 1px;\n  margin: -1px; padding: 0;\n  overflow: hidden;\n  clip: rect(0 0 0 0);\n  clip-path: inset(50%);\n  white-space: nowrap;\n  border: 0;\n}\n\n/* ===== SKIPLINK: schowany, wjeżdża po Tab (WCAG 2.4.1) ===== */\n.skiplink {\n  position: absolute;\n  top: 0; left: 0;\n  z-index: 1000;\n  transform: translateY(-120%);\n  background: #000;\n  color: #fff;\n  font-weight: bold;\n  padding: .75rem 1rem;\n  text-decoration: underline;\n}\n.skiplink:focus { transform: translateY(0); }\n\n/* ===== DWUKOLOROWY FOKUS (WCAG 2.4.7, 1.4.11) =====\n   Żółty outline + czarna obwódka: jeden z kolorów zawsze kontrastuje z tłem. */\n:focus-visible {\n  outline: 3px solid var(--fokus-wewn);\n  outline-offset: 2px;\n  box-shadow: 0 0 0 7px var(--fokus-zewn);\n}\n\n/* ===== MENU ===== */\nheader {\n  background: var(--granat);\n  border-radius: .5rem;\n  margin: 1rem 0;\n}\nnav ul {\n  list-style: none;\n  margin: 0;\n  padding: .5rem;\n  display: flex;\n  flex-wrap: wrap;         /* na wąskim ekranie przechodzi do nowej linii */\n  gap: .5rem;\n}\nnav a {\n  display: flex;\n  align-items: ce
